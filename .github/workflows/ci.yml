name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet run --project tests/NeuralNetworks.Tests --configuration Release --no-build
      - run: dotnet run --project examples/Xor --configuration Release --no-build -- train
      - run: dotnet run --project examples/Xor --configuration Release --no-build -- infer
      - run: dotnet run --project examples/Architectures --configuration Release --no-build -- all
      - run: dotnet run --project examples/Transformer --configuration Release --no-build -- all
      - run: dotnet format --verify-no-changes --no-restore
